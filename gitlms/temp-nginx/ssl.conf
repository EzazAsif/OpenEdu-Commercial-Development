server {
    listen 443 ssl;
    server_name www.openedu.innovativecollections.com;

    ssl_certificate /etc/letsencrypt/live/www.openedu.innovativecollections.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.openedu.innovativecollections.com/privkey.pem;

    location / {
        proxy_pass http://gitlms_django_1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
    }

    location /media/ {
        alias /usr/share/nginx/html/media/;
    }
}
