version: "3.8"

services:
  django:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=gitlms.settings
      - REDIS_URL=redis://redis:6379/1
      - REDIS_HOST=redis
      - PYTHONUNBUFFERED=1
    networks:
      - app-network

  daphne:
    build: .
    command: daphne -b 0.0.0.0 -p 8001 gitlms.asgi:application
    volumes:
      - .:/app
    ports:
      - "0.0.0.0:8001:8001"
    depends_on:
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=gitlms.settings
      - REDIS_URL=redis://redis:6379/1
      - REDIS_HOST=redis
      - PYTHONUNBUFFERED=1
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
