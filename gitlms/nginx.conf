events {}

http {
    include       mime.types;
    default_type  application/octet-stream;
    client_max_body_size 50M;

    upstream django {
        server django:8000;
    }

    upstream daphne {
        server daphne:8001;
    }
        # Localhost HTTP access for development
server {
    listen 80;
    server_name localhost 127.0.0.1;

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


        location /static/ {
            alias /usr/share/nginx/html/static/;
            access_log off;
            expires 30d;
        }

        location /media/ {
            alias /usr/share/nginx/html/media/;
            access_log off;
            expires 30d;
        }

        location /ws/ {
            proxy_pass http://daphne;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

    }

    # Root domain HTTP
    server {
        listen 80;
        server_name innovativecollections.com www.innovativecollections.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Root domain HTTPS
    server {
        listen 443 ssl;
        server_name innovativecollections.com www.innovativecollections.com;

        ssl_certificate /etc/letsencrypt/live/www.openedu.innovativecollections.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.openedu.innovativecollections.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location = /ads.txt {
            root /usr/share/nginx/html;
            default_type text/plain;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
        }

        error_log  /var/log/nginx/error.log warn;
        access_log /var/log/nginx/access.log;
    }

    # Redirect HTTP non-www openedu → HTTPS www.openedu
    server {
        listen 80;
        server_name openedu.innovativecollections.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://www.openedu.innovativecollections.com$request_uri;
        }
    }

    # HTTPS non-www openedu redirect to www.openedu
    server {
        listen 443 ssl;
        server_name openedu.innovativecollections.com;

        ssl_certificate /etc/letsencrypt/live/www.openedu.innovativecollections.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.openedu.innovativecollections.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        return 301 https://www.openedu.innovativecollections.com$request_uri;
    }

    # HTTP www.openedu redirect to HTTPS
    server {
        listen 80;
        server_name www.openedu.innovativecollections.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Main HTTPS www.openedu application server
    server {
        listen 443 ssl;
        server_name www.openedu.innovativecollections.com;

        ssl_certificate /etc/letsencrypt/live/www.openedu.innovativecollections.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.openedu.innovativecollections.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location /static/ {
            alias /usr/share/nginx/html/static/;
            access_log off;
            expires 30d;
        }

        location /media/ {
            alias /usr/share/nginx/html/media/;
            access_log off;
            expires 30d;
        }

        location /ws/ {
            proxy_pass http://daphne;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        error_log  /var/log/nginx/error.log warn;
        access_log /var/log/nginx/access.log;
    }
}
