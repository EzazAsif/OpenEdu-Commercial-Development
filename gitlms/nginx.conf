events {}

http {
    include       mime.types;
    default_type  application/octet-stream;
    client_max_body_size 50M;  # ← Accept up to 50 MB

  upstream django {
    server django:8000;
}

upstream daphne {
    server daphne:8001;
}

    server {
        listen 80;
        server_name www.openedu.innovativecollections.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name www.openedu.innovativecollections.com;

        ssl_certificate /etc/letsencrypt/live/www.openedu.innovativecollections.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.openedu.innovativecollections.com/privkey.pem;

        location /static/ {
            alias /usr/share/nginx/html/static/;
            access_log off;
            expires 30d;
        }

        location /media/ {
            alias /usr/share/nginx/html/media/;
            access_log off;
            expires 30d;
        }

        location /ws/ {
                proxy_pass http://daphne;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
         proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
}


        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        error_log  /var/log/nginx/error.log warn;
        access_log /var/log/nginx/access.log;
    }
}

