<footer class="bg-gray-100 p-4 border-t sticky bottom-0">
  <form
    id="chat-form"
    class="flex items-center space-x-2"
    onsubmit="return false;"
  >
    <input
      autofocus
      id="user-input"
      type="text"
      placeholder="Ask anything..."
      class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-black bg-white resize-none"
      oninput="handleInputChange()"
    />

    <!-- Image upload input -->
    <input id="image-input" type="file" accept="image/*" class="hidden" />
    <label
      for="image-input"
      class="cursor-pointer px-3 py-2 border border-gray-300 rounded-lg hover:bg-gray-200 text-gray-600"
    >
      📷
    </label>

    <button
      id="send-button"
      type="submit"
      class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600"
    >
      Send
    </button>
  </form>
</footer>
