{% for user in users %}
<!-- Student Card -->
<div
  class="flex items-center bg-white p-4 sm:p-6 rounded-lg shadow-md hover:shadow-xl transition-transform duration-300 transform hover:scale-105"
>
  <div class="w-14 h-14 sm:w-16 sm:h-16 mr-4 flex-shrink-0">
    <img
      src="{{ user.profilepicture.url }}"
      class="w-full h-full rounded-full object-cover"
      alt="{{ user.first_name }} {{ user.last_name }}"
    />
  </div>
  <div class="text-sm sm:text-base">
    <h3 class="font-semibold text-blue-900">
      {{ user.first_name }} {{ user.last_name }}
    </h3>
    <p class="text-gray-600">Email: {{ user.email }}</p>
    <p class="text-gray-600">{{ user.role }}</p>
  </div>
</div>
{% endfor %} {% if users|length == limit %}
<div
  id="load-more-trigger"
  hx-get="{% url 'students' %}?offset={{ offset|add:limit }}"
  hx-trigger="revealed"
  hx-target="#load-more-trigger"
  hx-swap="outerHTML"
  class="load-more-trigger flex justify-center items-center py-4"
>
  <div
    class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"
  ></div>
</div>
{% else %}
<!-- No more users: remove spinner -->
<div id="load-more-trigger"></div>
{% endif %}
