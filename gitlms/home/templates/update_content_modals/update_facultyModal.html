<!-- Update Modal -->
<div
  id="update_modal"
  class="hidden fixed inset-0 bg-gray-500 bg-opacity-75 flex justify-center items-center z-30"
>
  <div
    class="bg-white p-6 rounded-lg shadow-lg w-full sm:w-4/5 md:w-1/3 lg:w-1/3"
  >
    <h2 class="text-xl font-semibold mb-4">Update Faculty</h2>

    <!-- Hidden ID fields for faculty -->
    <form
      id="updateFacultyForm"
      method="POST"
      enctype="multipart/form-data"
      action="course={{course.id}}/update/"
    >
      {%csrf_token%}
      <input type="hidden" id="faculty_id_field" name="faculty_id" value="" />
      <input
        type="hidden"
        id="department_id_field"
        name="department_id"
        value=""
      />

      <div class="mb-4">
        <label for="facultyName" class="block text-sm font-semibold"
          >Faculty Name</label
        >
        <input
          type="text"
          id="facultyName"
          name="facultyName"
          class="w-full px-4 py-2 border border-gray-300 rounded-md"
          placeholder="Enter faculty name"
        />
      </div>

      <div class="mb-4">
        <label for="position" class="block text-sm font-semibold"
          >Position</label
        >
        <input
          type="text"
          id="position"
          name="position"
          class="w-full px-4 py-2 border border-gray-300 rounded-md"
          placeholder="Enter position"
        />
      </div>
      <div class="mb-4">
        <label
          for="facultyImage"
          class="block text-sm font-medium text-gray-700"
          >Upload Image</label
        >
        <input
          type="file"
          id="facultyImage"
          name="facultyImage"
          accept="image/*"
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md"
        />
      </div>
      <div class="flex justify-end">
        <button
          id="closeUpdateModalBtn"
          type="button"
          class="bg-gray-500 text-white px-4 py-2 rounded-lg mr-2"
          onclick="closeUpdateModal()"
        >
          Close
        </button>
        <button
          type="submit"
          class="bg-blue-500 text-white px-4 py-2 rounded-lg"
        >
          Save
        </button>
      </div>
    </form>
  </div>
</div>
