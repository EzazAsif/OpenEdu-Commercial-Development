<!-- Update Modal -->
<div
  id="update_modal"
  class="hidden fixed inset-0 bg-gray-500 bg-opacity-75 flex justify-center items-center z-30"
>
  <div
    class="bg-white p-6 rounded-lg shadow-lg w-full sm:w-4/5 md:w-1/3 lg:w-1/3"
  >
    <h2 class="text-xl font-semibold mb-4">Update Video</h2>

    <!-- Hidden fields for video, course, department, and faculty -->
    <form
      id="updateVideoForm"
      method="POST"
      enctype="multipart/form-data"
      action="videos/update/"
    >
      {%csrf_token%}
      <input type="hidden" id="video_id_field" name="video_id" value="" />
      <input type="hidden" id="course_id_field" name="course_id" value="" />
      <input
        type="hidden"
        id="department_id_field"
        name="department_id"
        value=""
      />
      <input type="hidden" id="faculty_id_field" name="faculty_id" value="" />

      <div class="mb-4">
        <label for="videoName" class="block text-sm font-semibold"
          >Video Name</label
        >
        <input
          type="text"
          id="videoName"
          name="videoName"
          class="w-full px-4 py-2 border border-gray-300 rounded-md"
          placeholder="Enter video name"
        />
      </div>

      <div class="mb-4">
        <label for="videoContent" class="block text-sm font-semibold"
          >Upload Video</label
        >
        <input
          type="file"
          id="videoContent"
          name="videoContent"
          class="w-full px-4 py-2 border border-gray-300 rounded-md"
        />
      </div>

      <div class="flex justify-end">
        <button
          id="closeUpdateModalBtn"
          type="button"
          class="bg-gray-500 text-white px-4 py-2 rounded-lg mr-2"
          onclick="closeUpdateModal()"
        >
          Close
        </button>
        <button
          type="submit"
          class="bg-blue-500 text-white px-4 py-2 rounded-lg"
        >
          Save
        </button>
      </div>
    </form>
  </div>
</div>
<script>
  document
    .getElementById("updateVideoForm")
    .addEventListener("submit", function (event) {
      var fileInput = document.getElementById("videoContent");
      var filePath = fileInput.value;
      var allowedExtensions = /(\.mp4|\.mov|\.avi|\.mkv|\.webm|\.flv|\.wmv)$/i;

      // Check if the uploaded file matches the allowed extensions
      if (!allowedExtensions.exec(filePath)) {
        alert(
          "Invalid file type. Please upload a video in MP4, MOV, AVI, MKV, WEBM, FLV, or WMV format."
        );
        event.preventDefault(); // Prevent form submission
      }
    });
</script>
