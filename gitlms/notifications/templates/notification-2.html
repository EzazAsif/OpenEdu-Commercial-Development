<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket Notification</title>
  </head>
  <body>
    <h1>Notifications</h1>
    <div id="notifications"></div>

    <script type="text/javascript">
      // Open a WebSocket connection
      const notificationSocket = new WebSocket(
        "ws://" + window.location.hostname + ":8001/ws/notifications/"
      );

      notificationSocket.onopen = function (e) {
        console.log("WebSocket connection established");
      };

      notificationSocket.onerror = function (e) {
        console.error("WebSocket error:", e);
      };

      notificationSocket.onclose = function (e) {
        console.error("WebSocket closed unexpectedly", e);
      };

      // When receiving a message from the WebSocket
      notificationSocket.onmessage = function (e) {
        try {
          console.log("Message event triggered!");
          const data = JSON.parse(e.data);
          console.log("Notification received:", data);
          const notificationElement = document.createElement("div");
          notificationElement.textContent = data.notification.notification; // <- if you sent full notification object
          document
            .getElementById("notifications")
            .appendChild(notificationElement);
        } catch (err) {
          console.error("Error handling message:", err);
        }
      };
    </script>
  </body>
</html>
