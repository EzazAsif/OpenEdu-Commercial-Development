events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    upstream django {
        server gitlms_django_1:8000;
    }

    upstream daphne {
        server gitlms_daphne_1:8001;
    }

    server {
        listen 443 ssl;
        server_name www.openedu.innovativecollections.com openedu.innovativecollections.com;

        ssl_certificate /etc/letsencrypt/live/www.openedu.innovativecollections.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.openedu.innovativecollections.com/privkey.pem;

        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://daphne;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /static/ {
            alias /usr/share/nginx/html/static/;
            autoindex on;
            access_log off;
            expires 30d;
        }

        location /media/ {
            alias /usr/share/nginx/html/media/;
            autoindex on;
            access_log off;
            expires 30d;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;
    }
}

