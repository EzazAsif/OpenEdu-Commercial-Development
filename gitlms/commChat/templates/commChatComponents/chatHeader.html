<div class="chat-header bg-gradient-to-r from-gray-200 to-gray-100">
  <div class="flex items-center space-x-3">
    <img
      src="{{institute.image.url}}"
      alt="Institute Logo"
      class="h-10 w-10 object-contain"
    />
    <span class="text-2xl font-semibold text-blue-800">{{institute.name}}</span>
  </div>
  <button
    class="text-blue-600 hover:text-blue-800 text-lg focus:outline-none"
    onclick="document.getElementById('chat-messages').innerHTML = '';"
  >
    Clear
  </button>
</div>
